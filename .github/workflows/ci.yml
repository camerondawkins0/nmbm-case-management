name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # The tests run against a real Postgres, because the rules that
    # matter most — caseload scoping, the no-contact view, one open
    # episode per person — live partly in SQL. Each run creates and
    # drops its own database on this server.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nmbm
          POSTGRES_PASSWORD: nmbm
          POSTGRES_DB: nmbm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nmbm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://nmbm:nmbm@localhost:5432/nmbm
